# Caps Lock = Shift while held, toggles Caps Lock on a quick tap.
#
# Source of truth lives here (tracked by dot). To apply:
#   sudo install -Dm644 ~/.config/keyd/default.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd

[ids]

*

[main]

# Hold = Shift (also when another key is pressed during the hold).
# Tap  = Caps Lock toggle, fired on release.
capslock = overloadt2(shift, capslock, 200)

# To revert to plain Caps Lock (toggle on press, no hold-Shift), use this instead:
# capslock = capslock
